<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check a match. Red Thread</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/knot.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="/" aria-label="Red Thread home">
      <svg viewBox="0 0 34 14" aria-hidden="true"><path d="M1 10H11C15.5 10 17 2.5 13 2.5S10.5 10 17 10H33" fill="none" stroke="#d71e28" stroke-width="2.2" stroke-linecap="round"/></svg>
      Red Thread
    </a>
    <a class="btn btn-red" href="/knot">Tie your knot</a>
  </div>
</header>

<main>
  <section class="match screen-enter" id="start" aria-labelledby="h-start">
    <p class="eyebrow">Check a match</p>
    <h1 class="headline" id="h-start" tabindex="-1">Who are you talking to?</h1>
    <p class="lede">Add their profile and your chat. We'll show where the story holds, and <strong>where it breaks.</strong></p>
    <form id="start-form" autocomplete="off">
      <div class="fields">
        <label class="field"><span></span><input id="name" maxlength="40" placeholder="Their first name" aria-label="Their first name"></label>
      </div>
      <div class="actions">
        <button class="btn btn-red" type="submit">Start</button>
        <button class="link" type="button" id="example">Try an example match</button>
      </div>
    </form>
    <p class="small" id="start-note">Nothing is saved. A match is forgotten after a day, or when you tap forget.</p>
  </section>

  <section class="match" id="view" hidden aria-labelledby="who">
    <p class="eyebrow">Your match</p>
    <h1 class="headline" tabindex="-1"><span id="who"></span><span class="badge" id="example-badge" hidden>Example, made for testing</span></h1>
    <div class="line-of">
      <article class="moment todo" id="m-profile" aria-live="polite"></article>
      <article class="moment todo" id="m-chat" aria-live="polite"></article>
      <article class="moment todo" id="m-breaks" aria-live="polite"></article>
      <article class="moment todo" id="m-checks" aria-live="polite"></article>
    </div>
    <div class="actions"><button class="link" id="forget">Forget this match</button></div>
  </section>
</main>
<script type="module" src="/static/match.js"></script>
</body>
</html>
