<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <title>Red Thread One Press architecture</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
  </defs>
  <g font-size="13" fill="#6e6e73">
    <text x="40" y="34" font-size="15" font-weight="700" fill="#d71e28">DURING THE CALL, UNDER 8 SECONDS</text>
    <text x="40" y="254" font-size="15" font-weight="700" fill="#d71e28">SECONDS LATER</text>
    <text x="40" y="404" font-size="15" font-weight="700" fill="#d71e28">AFTER THE CALL</text>
  </g>
  <g font-size="15" fill="#1d1d1f">
    <rect x="40" y="52" width="170" height="74" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="56" y="82" font-weight="700">One press</text><text x="56" y="104" font-size="13">Phone shortcut sends</text><text x="56" y="120" font-size="13">a screenshot</text>
    <rect x="250" y="52" width="190" height="74" fill="#ffffff" stroke="#d71e28" stroke-width="2"/>
    <text x="266" y="82" font-weight="700">Muse Spark 1.3</text><text x="266" y="104" font-size="13">Reads the screen: kind,</text><text x="266" y="120" font-size="13">caller, words, quotes</text>
    <rect x="480" y="52" width="210" height="74" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="496" y="82" font-weight="700">Code decides</text><text x="496" y="104" font-size="13">Rules, checked quotes,</text><text x="496" y="120" font-size="13">memory, report network</text>
    <rect x="730" y="52" width="190" height="74" fill="#1d1d1f"/>
    <text x="746" y="82" font-weight="700" fill="#ffffff">Notice 1</text><text x="746" y="104" font-size="13" fill="#ffffff">"This is a scam.</text><text x="746" y="120" font-size="13" fill="#ffffff">You can hang up."</text>
    <rect x="730" y="150" width="190" height="64" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="746" y="178" font-weight="700">Family text</text><text x="746" y="198" font-size="13">From your own phone</text>
    <rect x="250" y="272" width="190" height="74" fill="#ffffff" stroke="#d71e28" stroke-width="2"/>
    <text x="266" y="302" font-weight="700">Muse Wonder 1.0</text><text x="266" y="324" font-size="13">Web search on the</text><text x="266" y="340" font-size="13">scam's claim</text>
    <rect x="480" y="272" width="210" height="74" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="496" y="302" font-weight="700">Code keeps sources</text><text x="496" y="324" font-size="13">Only .gov.in, .nic.in and</text><text x="496" y="340" font-size="13">regulator citations</text>
    <rect x="730" y="272" width="190" height="74" fill="#1d1d1f"/>
    <text x="746" y="302" font-weight="700" fill="#ffffff">Notice 2</text><text x="746" y="324" font-size="13" fill="#ffffff">"Checked with official</text><text x="746" y="340" font-size="13" fill="#ffffff">sources." pib.gov.in</text>
    <rect x="40" y="422" width="170" height="74" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="56" y="452" font-weight="700">Tap and talk</text><text x="56" y="474" font-size="13">Your story, in English,</text><text x="56" y="490" font-size="13">Hindi or Tamil</text>
    <rect x="250" y="422" width="190" height="74" fill="#ffffff" stroke="#d71e28" stroke-width="2"/>
    <text x="266" y="452" font-weight="700">Voice Transcribe 1.0</text><text x="266" y="474" font-size="13">then Spark restates it.</text><text x="266" y="490" font-size="13">Adds nothing.</text>
    <rect x="480" y="422" width="210" height="74" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="496" y="452" font-weight="700">Code checks numbers</text><text x="496" y="474" font-size="13">Any number you never</text><text x="496" y="490" font-size="13">said is dropped</text>
    <rect x="730" y="422" width="190" height="74" fill="#1d1d1f"/>
    <text x="746" y="452" font-weight="700" fill="#ffffff">Your case</text><text x="746" y="474" font-size="13" fill="#ffffff">1930 words, first-hour</text><text x="746" y="490" font-size="13" fill="#ffffff">timer, cyber crime form</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 89H246"/><path d="M440 89H476"/><path d="M690 89H726"/><path d="M825 126V146"/>
    <path d="M585 126V190H345V268"/>
    <path d="M440 309H476"/><path d="M690 309H726"/>
    <path d="M210 459H246"/><path d="M440 459H476"/><path d="M690 459H726"/>
  </g>
  <text x="40" y="534" font-size="13" fill="#6e6e73">Red outline: a Meta model. Muse Image 1.0 makes fake scam screens that test the whole path in our test lab.</text>
</svg>
